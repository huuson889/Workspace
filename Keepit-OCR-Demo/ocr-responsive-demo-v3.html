/* Frozen viewer CSS from current Keepit-OCR 3.5.618, not a replacement responsive system. */

.sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.vseg{display:flex;align-items:center;flex:none;height:36px;padding:3px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.vseg button{height:28px;padding:0 12px;border:0;border-radius:7px;background:none;color:var(--muted);font-size:12.5px;font-weight:700}
.vseg button.on{background:var(--surface);color:var(--brand);box-shadow:0 2px 6px #2b245a14}
html.dark .vseg button.on{background:#1a1a1d;color:#c0c2ff}
.vbody{flex:1;min-height:0;display:flex;overflow:hidden}
.rail{width:var(--rail-w,112px);flex:none;overflow:auto;padding:14px 12px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:12px}
.rail[hidden],.railResize[hidden]{display:none!important}
.railResize{width:10px;margin-left:-5px;margin-right:-5px;flex:none;z-index:7;cursor:col-resize;touch-action:none;position:relative;outline:none}
.rail.rail-animate{transition:margin-left .26s cubic-bezier(.2,.8,.2,1)}
.rail.rail-collapsed{margin-left:calc(-1 * var(--rail-w,112px))}
.rail button{border:2px solid transparent;border-radius:9px;padding:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px}
.rail button .mini-pg{width:100%;aspect-ratio:3/4;border-radius:6px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.rail.slides button .mini-pg{aspect-ratio:16/9}
.rail button.on{border-color:var(--brand);color:var(--brand)}
.stage{flex:1;min-width:0;overflow:auto;padding:26px 20px 90px;display:flex;justify-content:center}
.paper{width:min(720px,100%);background:var(--paper);color:var(--paperInk);border-radius:6px;box-shadow:0 12px 34px #2a245a24;padding:56px 64px;font-family:Georgia,"Times New Roman",serif;font-size:15.5px;line-height:1.65;height:max-content}
.paper h2{font-family:inherit;margin:0 0 4px;font-size:22px}
.paper .src{font:12px/1.4 Inter,system-ui,sans-serif;color:#8a8fa3;margin-bottom:22px;letter-spacing:.3px}
.paper p{margin:0 0 14px;text-align:justify}
.reflow{width:min(700px,100%);height:max-content;font-size:17px;line-height:1.75;color:var(--ink)}
.reflow h2{font-size:25px;line-height:1.25;margin:0 0 6px}
.reflow .src{font-size:12.5px;color:var(--muted);margin-bottom:22px}
.reflow h3{font-size:18px;margin:22px 0 8px}
.reflow .para{margin:0 0 16px;padding:2px 0}
.para .tr{display:none;margin-top:6px;padding:8px 12px;border-left:3px solid var(--brand2);border-radius:0 10px 10px 0;background:var(--brandSoft);color:var(--ink2);font-size:15px;line-height:1.6}
html.dark .para .tr{background:#1d2140}
.translate .para .tr{display:block}
.reflow li{margin-bottom:6px}
mark.hl{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}
html.dark mark.hl{background:#a1620755;color:#fde9b5}
mark.hl.note{background:#c7f0dc}
html.dark mark.hl.note{background:#16653f66;color:#c9f5df}
.speaking{background:#ddd6fe;border-radius:4px;transition:background .2s}
html.dark .speaking{background:#4c3fa066}
.wc{position:relative;text-decoration:underline 2px;text-underline-offset:5px}
.wcl{display:none;position:absolute;left:0;top:100%;margin-top:4px;font:600 12px/1 Inter,system-ui,sans-serif;white-space:nowrap}
.wcOn .wcl{display:block}
.wcOn .reflow{line-height:2.25}
.wc.n{text-decoration-color:#2f6fe4}
.wc.n .wcl{color:#2f6fe4}
.wc.v{text-decoration-color:#e5484d}
.wc.v .wcl{color:#e5484d}
.wc.a{text-decoration-color:#269b7b}
.wc.a .wcl{color:#269b7b}
.wc.d{text-decoration-color:#ba7b2b}
.wc.d .wcl{color:#ba7b2b}

.demoSlide{width:min(760px,100%);aspect-ratio:16/9;border-radius:12px;background:var(--paper);box-shadow:0 12px 34px #2a245a24;padding:40px 48px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.demoSlide:before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:linear-gradient(135deg,#f4a96a55,#e2702b33)}
.demoSlide h2{margin:0 0 14px;font-size:28px;color:var(--paperInk)}
.demoSlide ul{margin:0;padding-left:22px;font-size:18px;line-height:1.7;color:var(--paperInk)}
.slideWrap{display:flex;flex-direction:column;gap:14px;width:min(760px,100%);height:max-content}
.snotes{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:14px;color:var(--ink2)}
.snotes b{display:block;font-size:12px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px}
.pager{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 16px);white-space:nowrap;display:flex;align-items:center;gap:4px;padding:2px 3px;border:1px solid var(--line);border-radius:12px;background:var(--chip);backdrop-filter:blur(14px);box-shadow:var(--shadow);font-size:12px;font-weight:600;opacity:1;transition:opacity .14s ease}
.pager.dimmed{opacity:.24;transition-duration:.55s}
.pager.pager-auto-hidden{opacity:0;pointer-events:none}
.pager.pager-off{visibility:hidden;pointer-events:none}
.pager:has(:focus-visible),.pager:has(input:focus),.pager:has(select:focus){opacity:1}
@media  (prefers-reduced-motion:reduce){.pager,.pager.dimmed{transition:none}}
.pager button{width:30px;height:30px;border:0;border-radius:50%;background:none;display:grid;place-items:center}
.pager button:hover{background:var(--soft)}
.pager [hidden]{display:none!important}
.pager .pageFullscreen{width:36px;height:36px;border-radius:8px;flex:none}
.pager .pageMenu{width:36px;height:36px;flex:none;margin-left:2px;border-left:1px solid var(--line2);border-radius:8px}
.stageWrap{position:relative;flex:1;min-width:0;display:flex}
/* ---------- toast / demo ---------- */
.toast{position:fixed;left:50%;top:18px;z-index:90;transform:translate(-50%,-30px);opacity:0;pointer-events:none;padding:10px 16px;border-radius:12px;background:#1f2433;color:#fff;font-size:13px;box-shadow:0 10px 30px #0004;transition:.25s}

.toast.hasAction{display:flex;align-items:center;gap:14px;pointer-events:auto;text-align:left}
.toastAction{padding:0;border:0;background:none;font:inherit;font-weight:700;color:#d7d2fb;text-decoration:underline;text-underline-offset:2px;cursor:pointer;white-space:nowrap}

/* ---------- embedded in the dashboard shell ---------- */
/* The dashboard owns the scroll root and the shared topbar, so this page renders
   as flat content that reports its height instead of scrolling on its own. */
/* v3.5.525: nền tab Tài liệu phải ĐEN y như các tab khác.
   Trước đây để background:transparent khi nhúng, nhưng khung (iframe) lại có color-scheme tối
   nên Chrome tự tô nền canvas bằng màu nền mặc định của chế độ tối — đo trên ảnh người dùng:
   vùng nội dung tab Tài liệu = #121212, còn các tab khác = #000. Giờ đặt nền tường minh bằng
   đúng biến --page của trang (tối: #000, sáng: #f5f5ff) để khung không tự tô nữa. */
html.dash-embedded,html.dash-embedded body{height:auto;min-height:0;overflow:hidden;background:var(--page,#fff)}
html.dash-embedded .app{display:block;min-height:0}
/* v3.5.526: khoảng trống 2 bên giống các tab khác — tab Tổng quan dùng
   padding:0 clamp(16px,3vw,32px) 42px; trước đây trang tài liệu dùng 44px nên thụt vào nhiều hơn. */
/* v3.5.528: khung tài liệu là một tài liệu riêng nên không đọc được biến --dash-page-* của Dashboard;
   giữ đúng các giá trị tương ứng (lề hai bên clamp(16px,3vw,32px), đáy 42px — như tab Tổng quan). */
html.dash-embedded .main{padding:0 clamp(16px,3vw,32px) 20px}
@media(max-width:980px){html.dash-embedded .main{padding:0 22px 40px}}
@media(max-width:760px){html.dash-embedded .main{padding:0 12px 24px}}
html.dash-embedded .topbar{display:none!important}

  --brand:#8f86f2;--brand2:#a49cf7;--brandSoft:#25264a;--green:#45c79f;--greenSoft:#123329;--orange:#e0a65a;--orangeSoft:#33260f;
